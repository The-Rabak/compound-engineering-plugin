<!doctype html><html><head><title>Plan</title></head><body><h1>Plan</h1><script type="application/json" id="artifact-data">{"schema_version":1,"kind":"brainstorm","title":"Add CSV Export to the Reporting Dashboard","type":"feat","date":"2026-07-09","status":"complete","refs":{"brainstorm_ref":null,"architecture_ref":null,"tickets_ref":null,"source_docs":{"tickets":[],"docs":[],"figma":[],"plans":[]}},"render_meta":{"archetypes":["brainstorm-narrative"],"design_seed":"brainstorm-csv-export-2026-07-09-a1"},"problem_narrative":"Analysts currently screenshot report tables to share them, losing precision and making downstream re-analysis impossible.","user_story":"As an analyst, I need to export any report I can view as a CSV file, so that I can re-analyze the underlying numbers in my own tools instead of retyping them from a screenshot.","architectural_context":"Lives in the existing reporting module; the serializer is a pure function reused by both the new export route and, later, a scheduled-export job.","success_criteria":["A user can export any report they can view as a CSV file.","Exported CSV opens correctly in Excel and Google Sheets without column misalignment."],"chosen_approach":"Add a pure toCsv() serializer reused by a new export API route and a UI button, rather than a client-side-only export or a background export job, because it fully satisfies both success criteria with the least moving parts.","key_decisions":[{"decision":"Stream the export instead of buffering the whole CSV in memory","rationale":"Some reports have 100k+ rows; buffering risks OOM on the API pod."},{"decision":"Reuse the existing report-read permission for the export endpoint instead of a new scope","rationale":"Export is the same data the user can already view; a new scope would be needless complexity."}],"resolved_questions":[{"question":"Should exports support XLSX as well as CSV?","answer":"No -- deferred; CSV alone satisfies both success criteria and the user's stated workflow."}],"open_questions":[],"handoff":{"problem_narrative":true,"user_story":true,"architectural_context":true,"success_criteria":true},"scope_boundary":"Explicitly included: serializer, export route, UI button. Deferred: scheduled\u002Frecurring exports, XLSX format.","non_goals":"Scheduled\u002Frecurring exports. XLSX format.","constitution_alignment":"No constitution version is recorded for this repository; no waivers apply.","approaches_considered":"A client-side-only export was rejected because large reports would freeze the browser tab. A background export job was rejected as premature -- no user has asked for exports larger than an interactive request can serve.","stakeholder_impact":"Analysts get a direct export path. Engineering gains a reusable serializer for a later scheduled-export feature. No operations or business impact beyond normal feature rollout.","ext":{}}</script></body></html>
